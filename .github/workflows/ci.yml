name: GeoField Pro CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "phase-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace - Install, Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint JavaScript
        run: pnpm lint

      - name: Test Admin Web
        run: pnpm test:web

      - name: Test Employee Mobile
        run: pnpm test:mobile

      - name: Build applications
        run: pnpm build:all

  api:
    name: API - Install, Migrate, Build and Test
    # Keep the runner's PostgreSQL 16 client aligned with the PostGIS 16 service.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: geofield_test
          POSTGRES_USER: geofield
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofield -d geofield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://geofield:test_password@localhost:5432/geofield_test
      JWT_ISSUER: geofield-pro-api
      JWT_AUDIENCE: geofield-pro-tests
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      ARGON2_MEMORY_COST: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      REFRESH_TOKEN_TTL_DAYS: 7
      AUTH_COOKIE_NAME: geofield_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @geofield/api db:generate

      - name: Deploy database migrations
        run: pnpm --filter @geofield/api db:deploy

      - name: Verify PostGIS through Prisma
        working-directory: apps/api
        run: |
          node --input-type=module -e '
            import { PrismaPg } from "@prisma/adapter-pg";
            import { PrismaClient } from "@prisma/client";

            const adapter = new PrismaPg({
              connectionString: process.env.DATABASE_URL
            });

            const prisma = new PrismaClient({
              adapter
            });

            try {
              const result = await prisma.$queryRaw`
                SELECT PostGIS_Full_Version() AS version
              `;

              console.log("PostGIS verified:", result[0].version);
            } finally {
              await prisma.$disconnect();
            }
          '

      - name: Verify isolated backup and restore
        env:
          PGPASSWORD: test_password
          RESTORE_DATABASE_URL: postgresql://geofield:test_password@localhost:5432/geofield_restore_test
        run: |
          set -Eeuo pipefail
          dump_file="$RUNNER_TEMP/geofield-test.dump"

          pg_dump --version
          pg_restore --version
          echo "Creating custom-format database backup"
          pg_dump --format=custom --no-owner --no-privileges \
            --dbname="$DATABASE_URL" --file="$dump_file"

          echo "Creating isolated restore database"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE geofield_restore_test'

          echo "Restoring backup into isolated database"
          pg_restore --verbose --exit-on-error --no-owner --no-privileges \
            --dbname="$RESTORE_DATABASE_URL" "$dump_file"

          echo "Comparing row counts and restored PostGIS geometries"
          source_counts=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -F '|' -c \
            "SELECT (SELECT count(*) FROM organizations), (SELECT count(*) FROM users), (SELECT count(*) FROM villages), (SELECT count(*) FROM location_observations), (SELECT count(*) FROM villages WHERE boundary IS NOT NULL), coalesce((SELECT md5(string_agg(encode(ST_AsEWKB(boundary), 'hex'), ',' ORDER BY id)) FROM villages WHERE boundary IS NOT NULL), md5(''))")
          restored_counts=$(psql "$RESTORE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA -F '|' -c \
            "SELECT (SELECT count(*) FROM organizations), (SELECT count(*) FROM users), (SELECT count(*) FROM villages), (SELECT count(*) FROM location_observations), (SELECT count(*) FROM villages WHERE boundary IS NOT NULL), coalesce((SELECT md5(string_agg(encode(ST_AsEWKB(boundary), 'hex'), ',' ORDER BY id)) FROM villages WHERE boundary IS NOT NULL), md5(''))")
          echo "Source integrity summary: $source_counts"
          echo "Restored integrity summary: $restored_counts"
          test "$source_counts" = "$restored_counts"
          echo "Confirming PostGIS is available after restore"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            'SELECT PostGIS_Full_Version()'

      - name: Build API
        run: pnpm --filter @geofield/api build

      - name: Run API tests with coverage
        run: pnpm --filter @geofield/api test:coverage

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

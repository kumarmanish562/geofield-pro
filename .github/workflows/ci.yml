name: GeoField Pro CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "phase-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace - Install, Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint JavaScript
        run: pnpm lint

      - name: Build applications
        run: pnpm build:all

  api:
    name: API - Install, Migrate, Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: geofield_test
          POSTGRES_USER: geofield
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofield -d geofield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://geofield:test_password@localhost:5432/geofield_test?schema=public
      JWT_ISSUER: geofield-pro-api
      JWT_AUDIENCE: geofield-pro-tests
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      ARGON2_MEMORY_COST: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      REFRESH_TOKEN_TTL_DAYS: 7
      AUTH_COOKIE_NAME: geofield_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @geofield/api db:generate

      - name: Deploy database migrations
        run: pnpm --filter @geofield/api db:deploy

      - name: Verify PostGIS through Prisma
        working-directory: apps/api
        run: |
          node --input-type=module -e '
            import { PrismaPg } from "@prisma/adapter-pg";
            import { PrismaClient } from "@prisma/client";

            const adapter = new PrismaPg({
              connectionString: process.env.DATABASE_URL
            });

            const prisma = new PrismaClient({
              adapter
            });

            try {
              const result = await prisma.$queryRaw`
                SELECT PostGIS_Full_Version() AS version
              `;

              console.log("PostGIS verified:", result[0].version);
            } finally {
              await prisma.$disconnect();
            }
          '

      - name: Build API
        run: pnpm --filter @geofield/api build

      - name: Run automated tests
        run: pnpm --filter @geofield/api test
